name: Build OSAM AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore new OSAM AI launcher logo
        run: |
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          base64 -d android-app/osam-original-logo.png.base64 > android-app/app/src/main/res/drawable-nodpi/osam_launcher.jpg
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSAM-AI-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK for direct Chrome download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.4
          name: OSAM AI Android v1.2.4
          make_latest: true
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
