
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSAM AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        #authScreen[hidden],
        #appShell[hidden] {
            display: none !important;
        }

        #authScreen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #101010;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-card {
            width: 100%;
            max-width: 390px;
            background: #1c1c1c;
            padding: 30px;
            border: 1px solid #333;
            border-radius: 18px;
            box-sizing: border-box;
            text-align: center;
        }

        .osam-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .auth-logo {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
        }

        .auth-card h1 {
            margin-bottom: 8px;
        }

        .auth-card p {
            color: #aaa;
        }

        .auth-card input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #444;
            border-radius: 9px;
            background: #111;
            color: white;
            font-size: 15px;
        }

        .auth-card button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: 0;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        #authSubmit {
            background: white;
            color: #111;
        }

        #googleLogin {
            background: #fff;
            color: #222;
        }

        #switchAuth {
            background: transparent;
            color: #fff;
        }

        #authMessage {
            color: #ff8585;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        #logoutBtn {
            padding: 8px 12px;
            border: 1px solid #777;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            cursor: pointer;
        }

        .brand-logo,
        .profile-avatar,
        .welcome-logo {
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
        }

        .profile-avatar {
            width: 38px;
            height: 38px;
        }

        .welcome-logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
        }
    </style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="authScreen">
    <div class="auth-card">

        <div class="auth-logo">
            <img class="osam-logo"
                 src="{{ url_for('static', filename='osam-logo.png') }}"
                 alt="OSAM AI Logo">
        </div>

        <h1>OSAM AI</h1>
        <p id="authHeading">Welcome Back! Login to continue.</p>

        <form id="authForm">
            <input type="email"
                   id="authEmail"
                   placeholder="Email Address"
                   autocomplete="email"
                   required>

            <input type="password"
                   id="authPassword"
                   placeholder="Password (minimum 6 characters)"
                   autocomplete="current-password"
                   minlength="6"
                   required>

            <button type="submit" id="authSubmit">Login</button>
        </form>

        <button type="button" id="switchAuth">
            Don't have an account? Sign Up
        </button>

        <button type="button" id="googleLogin">
            G &nbsp; Continue with Google
        </button>

        <p id="authMessage" role="alert"></p>
    </div>
</div>

<!-- MAIN CHAT APP -->
<div class="app" id="appShell" hidden>

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">
            <div class="brand">

                <div class="brand-logo">
                    <img class="osam-logo"
                         src="{{ url_for('static', filename='osam-logo.png') }}"
                         alt="OSAM AI">
                </div>

                <span>OSAM AI</span>
            </div>

            <button class="new-chat" id="newChatBtn">
                <span>＋</span> New Chat
            </button>
        </div>

        <div class="history-title">YOUR CHATS</div>
        <div class="chat-history" id="chatHistory"></div>

        <div class="sidebar-bottom">
            <div class="profile">

                <div class="profile-avatar">
                    <img class="osam-logo"
                         src="{{ url_for('static', filename='osam-logo.png') }}"
                         alt="OSAM AI">
                </div>

                <div>
                    <strong>OSAM AI</strong>
                    <small id="userEmail">Signed in</small>
                </div>

            </div>
        </div>

    </aside>

    <main class="main">

        <header class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <div class="mobile-brand">OSAM AI</div>
            <div class="model-label">AI Assistant <span>●</span></div>
            <button id="logoutBtn" type="button">Logout</button>
        </header>

        <section class="chat-area" id="chatArea">

            <div class="welcome-screen" id="welcomeScreen">

                <div class="welcome-logo">
                    <img class="osam-logo"
                         src="{{ url_for('static', filename='osam-logo.png') }}"
                         alt="OSAM AI Logo">
                </div>

                <h1>Hello, I'm <span>OSAM AI</span></h1>
                <p>How can I help you today?</p>

                <div class="suggestions">

                    <button class="suggestion"
                            data-prompt="Explain something in simple words">
                        <span>✦</span>
                        <strong>Explain something</strong>
                        <small>Make difficult topics easy</small>
                    </button>

                    <button class="suggestion"
                            data-prompt="Help me write something">
                        <span>✎</span>
                        <strong>Write something</strong>
                        <small>Stories, emails and more</small>
                    </button>

                    <button class="suggestion"
                            data-prompt="Help me with coding">
                        <span>⌘</span>
                        <strong>Write code</strong>
                        <small>Learn and build projects</small>
                    </button>

                    <button class="suggestion"
                            data-prompt="Give me some creative ideas">
                        <span>✧</span>
                        <strong>Brainstorm ideas</strong>
                        <small>Explore something new</small>
                    </button>

                </div>
            </div>

            <div class="messages" id="chatMessages"></div>

        </section>

        <footer class="input-section">

            <form class="input-box" id="chatForm">

                <textarea
                    id="messageInput"
                    placeholder="Message OSAM AI..."
                    rows="1"
                    required></textarea>

                <button type="submit"
                        id="sendButton"
                        class="send-btn">
                    ↑
                </button>

            </form>

            <p class="disclaimer">
                OSAM AI can make mistakes. Check important information.
            </p>

        </footer>

    </main>
</div>

<!-- FIREBASE AUTHENTICATION -->
<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

    // Keep your existing Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDPDu9hSGrc9XzRnN8yUEvOKn6nhESiZd4",
        authDomain: "osam-ai.firebaseapp.com",
        projectId: "osam-ai",
        storageBucket: "osam-ai.firebasestorage.app",
        messagingSenderId: "576897627046",
        appId: "1:576897627046:web:6e5d3a8b1367e8637f1567",
        measurementId: "G-CPJKPCMNKR"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const googleProvider = new GoogleAuthProvider();

    const authScreen = document.getElementById("authScreen");
    const appShell = document.getElementById("appShell");

    const authForm = document.getElementById("authForm");
    const authEmail = document.getElementById("authEmail");
    const authPassword = document.getElementById("authPassword");
    const authSubmit = document.getElementById("authSubmit");
    const authHeading = document.getElementById("authHeading");
    const authMessage = document.getElementById("authMessage");

    const switchAuth = document.getElementById("switchAuth");
    const googleLogin = document.getElementById("googleLogin");

    let isSignup = false;

    switchAuth.addEventListener("click", () => {

        isSignup = !isSignup;
        authMessage.textContent = "";

        authHeading.textContent = isSignup
            ? "Create your OSAM AI account"
            : "Welcome Back! Login to continue.";

        authSubmit.textContent = isSignup
            ? "Create Account"
            : "Login";

        switchAuth.textContent = isSignup
            ? "Already have an account? Login"
            : "Don't have an account? Sign Up";

        authPassword.autocomplete =
            isSignup ? "new-password" : "current-password";
    });

    authForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        authMessage.textContent = "";
        authSubmit.disabled = true;

        try {

            const email = authEmail.value.trim();
            const password = authPassword.value;

            if (isSignup) {

                await createUserWithEmailAndPassword(
                    auth, email, password
                );

            } else {

                await signInWithEmailAndPassword(
                    auth, email, password
                );

            }

        } catch (error) {

            authMessage.textContent =
                error.message.replace("Firebase: ", "");

        } finally {

            authSubmit.disabled = false;

        }
    });

    googleLogin.addEventListener("click", async () => {

        authMessage.textContent = "";
        googleLogin.disabled = true;

        try {

            await signInWithPopup(auth, googleProvider);

        } catch (error) {

            authMessage.textContent =
                error.message.replace("Firebase: ", "");

        } finally {

            googleLogin.disabled = false;

        }
    });

    document.getElementById("logoutBtn")
        .addEventListener("click", async () => {

            try {

                await signOut(auth);

            } catch (error) {

                alert("Logout failed. Please try again.");

            }
        });

    onAuthStateChanged(auth, (user) => {

        if (user) {

            authScreen.hidden = true;
            appShell.hidden = false;

            document.getElementById("userEmail").textContent =
                user.email || "Signed in";

        } else {

            appShell.hidden = true;
            authScreen.hidden = false;

        }
    });

</script>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
