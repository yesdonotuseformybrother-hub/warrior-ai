<!-- FIREBASE AUTHENTICATION -->
<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signInWithCredential,
    GoogleAuthProvider,
    signInWithPopup,
    signInWithRedirect,
    getRedirectResult,
    onAuthStateChanged,
    signOut,
    updateProfile
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyDPDu9hSGrc9XzRnN8yUEvOKn6nhESiZd4",

    authDomain: "osam-ai.firebaseapp.com",

    projectId: "osam-ai",

    storageBucket: "osam-ai.firebasestorage.app",

    messagingSenderId: "576897627046",

    appId: "1:576897627046:web:6e5d3a8b1367e8637f1567",

    measurementId: "G-CPJKPCMNKR"

};


const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);

const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: "select_account" });


/* ELEMENTS */

const authScreen = document.getElementById("authScreen");
const authForm = document.getElementById("authForm");
const authEmail = document.getElementById("authEmail");
const authPassword = document.getElementById("authPassword");
const authSubmit = document.getElementById("authSubmit");
const authHeading = document.getElementById("authHeading");
const authMessage = document.getElementById("authMessage");
const switchAuth = document.getElementById("switchAuth");
const googleLogin = document.getElementById("googleLogin");

const guestActions = document.getElementById("guestActions");
const userActions = document.getElementById("userActions");

const profileMenu = document.getElementById("profileMenu");
const profileTrigger = document.getElementById("profileTrigger");

let isSignup = false;


/* LOGIN */

function openLogin() {

    isSignup = false;

    authHeading.textContent =
        "Welcome Back! Login to continue.";

    authSubmit.textContent = "Login";

    switchAuth.textContent =
        "Don't have an account? Sign Up";

    authPassword.autocomplete = "current-password";

    authMessage.textContent = "";

    authScreen.hidden = false;

}


/* SIGNUP */

function openSignup() {

    isSignup = true;

    authHeading.textContent =
        "Create your OSAM AI account";

    authSubmit.textContent = "Create Account";

    switchAuth.textContent =
        "Already have an account? Login";

    authPassword.autocomplete = "new-password";

    authMessage.textContent = "";

    authScreen.hidden = false;

}


/* AUTH BUTTONS */

document.getElementById("loginBtn")
    .addEventListener("click", openLogin);

document.getElementById("signupBtn")
    .addEventListener("click", openSignup);

document.getElementById("closeAuth")
    .addEventListener("click", () => {

        authScreen.hidden = true;

    });


/* SWITCH AUTH */

switchAuth.addEventListener("click", () => {

    isSignup = !isSignup;

    authMessage.textContent = "";

    authHeading.textContent = isSignup
        ? "Create your OSAM AI account"
        : "Welcome Back! Login to continue.";

    authSubmit.textContent = isSignup
        ? "Create Account"
        : "Login";

    switchAuth.textContent = isSignup
        ? "Already have an account? Login"
        : "Don't have an account? Sign Up";

    authPassword.autocomplete =
        isSignup ? "new-password" : "current-password";

});


/* EMAIL LOGIN / SIGNUP */

authForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    authMessage.textContent = "";

    authSubmit.disabled = true;

    try {

        const email = authEmail.value.trim();

        const password = authPassword.value;

        if (isSignup) {

            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        } else {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }

    } catch (error) {

        authMessage.textContent =
            error.message.replace("Firebase: ", "");

    } finally {

        authSubmit.disabled = false;

    }

});


/* GOOGLE LOGIN */
window.osamNativeGoogleResult = async (idToken, nativeError) => {
    try {
        if (nativeError || !idToken) throw new Error(nativeError || "Google sign-in was cancelled.");
        await signInWithCredential(auth, GoogleAuthProvider.credential(idToken));
        authMessage.textContent = "";
    } catch (error) {
        authMessage.textContent = error.message.replace("Firebase: ", "");
    } finally {
        googleLogin.disabled = false;
    }
};

googleLogin.addEventListener("click", async () => {
    authMessage.textContent = "";
    googleLogin.disabled = true;
    try {
        // The Android app uses the native account chooser; regular web uses Firebase OAuth.
        if (window.OsamAndroid && typeof window.OsamAndroid.startGoogleSignIn === "function") {
            window.OsamAndroid.startGoogleSignIn();
            return;
        }
        const isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        if (isMobileDevice) {
            await signInWithRedirect(auth, googleProvider);
            return;
        }
        await signInWithPopup(auth, googleProvider);
    } catch (error) {
        // If the browser blocks the OAuth popup, fall back to a full-page redirect.
        if (error && (error.code === "auth/popup-blocked" || error.code === "auth/cancelled-popup-request")) {
            try {
                await signInWithRedirect(auth, googleProvider);
                return;
            } catch (redirectError) {
                authMessage.textContent = redirectError.message.replace("Firebase: ", "");
            }
        } else {
            authMessage.textContent = error.message.replace("Firebase: ", "");
        }
        googleLogin.disabled = false;
    }
});

/* COMPLETE MOBILE WEB REDIRECT RESULT */
getRedirectResult(auth).catch((error) => {
    console.error("Google sign-in redirect error:", error);
    authMessage.textContent = error.message.replace("Firebase: ", "");
});

/* AUTH STATE */

onAuthStateChanged(auth, (user) => {

    if (user) {

        guestActions.hidden = true;

        userActions.hidden = false;

        authScreen.hidden = true;

        document.getElementById("userEmail").textContent =
            user.email || "Signed in";

        document.getElementById("menuProfileEmail").textContent =
            user.email || "Signed in";

        document.getElementById("profileName").textContent =
            user.displayName || "OSAM AI";

        document.getElementById("menuProfileName").textContent =
            user.displayName || "OSAM AI";

        const initial = (user.displayName || user.email || "OS").charAt(0).toUpperCase();
        const avatarMarkup = user.photoURL
            ? '<img src="' + user.photoURL.replace(/"/g, '&quot;') + '" alt="">'
            : initial;
        document.getElementById("profileAvatar").innerHTML = avatarMarkup;
        document.getElementById("userMenuAvatar").innerHTML = avatarMarkup;
        document.querySelector("#profileMenuAccount .profile-avatar").innerHTML = avatarMarkup;
        document.getElementById("userMenuBtn").setAttribute("aria-label", "Account menu for " + (user.email || "signed-in user"));

    } else {

        guestActions.hidden = false;

        userActions.hidden = true;

        authScreen.hidden = true;

        document.getElementById("userEmail").textContent = "Free";

        document.getElementById("profileName").textContent = "OSAM AI";
        document.getElementById("menuProfileEmail").textContent = "Free";
        document.getElementById("userMenuAvatar").textContent = "OS";
        document.getElementById("userMenuBtn").setAttribute("aria-label", "Account menu");

    }

});


/* LOGOUT */

document.getElementById("logoutBtn")
    .addEventListener("click", async () => {

        try {

            await signOut(auth);

            profileMenu.hidden = true;

        } catch (error) {

            alert("Logout failed. Please try again.");

        }

    });


/* PROFILE MENU */

profileTrigger.addEventListener("click", (event) => {

    event.stopPropagation();

    profileMenu.hidden = !profileMenu.hidden;

});


document.addEventListener("click", (event) => {

    if (
        !profileMenu.contains(event.target) &&
        !profileTrigger.contains(event.target) &&
        !document.getElementById("userMenuBtn").contains(event.target)
    ) {

        profileMenu.hidden = true;

    }

});


/* FREE SCHEDULED, PLUGINS AND EXPLORE PANELS */
const featureModal = document.getElementById("featureModal");
const featureTitle = document.getElementById("featureTitle");
const featureContent = document.getElementById("featureContent");
const scheduledKey = "osam-ai-scheduled-reminders";
let reminderTimers = [];

function closeFeaturePanel() { featureModal.hidden = true; }
document.getElementById("featureClose")?.addEventListener("click", closeFeaturePanel);
featureModal?.addEventListener("click", e => { if (e.target === featureModal) closeFeaturePanel(); });

function openFeaturePanel(title, html) {
  featureTitle.textContent = title;
  featureContent.innerHTML = html;
  featureModal.hidden = false;
}
function readScheduled() {
  try { return JSON.parse(localStorage.getItem(scheduledKey) || "[]"); }
  catch (_) { return []; }
}
function saveScheduled(items) { localStorage.setItem(scheduledKey, JSON.stringify(items)); }
function armReminders() {
  reminderTimers.forEach(clearTimeout); reminderTimers = [];
  const now = Date.now();
  readScheduled().forEach(item => {
    const delay = new Date(item.when).getTime() - now;
    if (delay > 0 && delay < 2147480000) {
      reminderTimers.push(setTimeout(() => {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("OSAM AI reminder", { body: item.text });
        } else { alert("OSAM AI reminder: " + item.text); }
        saveScheduled(readScheduled().filter(x => x.id !== item.id));
        if (!featureModal.hidden && featureTitle.textContent === "Scheduled") showScheduled();
      }, delay));
    }
  });
}
function showScheduled() {
  const items = readScheduled().sort((a,b) => new Date(a.when)-new Date(b.when));
  const rows = items.map(item => '<div class="scheduled-row"><div><strong></strong><small></small></div><button type="button" data-remove-reminder="'+item.id+'">Delete</button></div>').join("");
  openFeaturePanel("Scheduled", '<p class="feature-muted">Create a free reminder. It can notify you while this website is open; keep the tab open for reliable alerts.</p><form id="reminderForm" class="reminder-form"><label>What should OSAM AI remind you about?</label><input id="reminderText" maxlength="180" required placeholder="e.g. Study for 30 minutes"><label>Date and time</label><input id="reminderWhen" type="datetime-local" required><button type="submit">＋ Add reminder</button></form><h3>Your reminders</h3><div id="reminderList">'+(rows || '<p class="feature-muted">No reminders yet.</p>')+'</div>');
  items.forEach((item,i) => {
    const row=featureContent.querySelectorAll(".scheduled-row")[i];
    if(row){row.querySelector("strong").textContent=item.text;row.querySelector("small").textContent=new Date(item.when).toLocaleString();}
  });
  featureContent.querySelectorAll("[data-remove-reminder]").forEach(btn=>btn.addEventListener("click",()=>{
    saveScheduled(readScheduled().filter(x=>x.id!==btn.dataset.removeReminder)); showScheduled(); armReminders();
  }));
  document.getElementById("reminderForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const textValue=document.getElementById("reminderText").value.trim();
    const when=document.getElementById("reminderWhen").value;
    if(!textValue || new Date(when).getTime()<=Date.now()){alert("Please choose a future date and time.");return;}
    if("Notification" in window && Notification.permission==="default"){try{await Notification.requestPermission();}catch(_){}}
    const items=readScheduled(); items.push({id:Date.now().toString(),text:textValue,when}); saveScheduled(items); armReminders(); showScheduled();
  });
}
function showPlugins() {
  openFeaturePanel("Plugins", '<p class="feature-muted">Free tools already built into OSAM AI. No paid plugin subscription required.</p><div class="feature-card"><strong>📷 Image understanding</strong><p>Attach a JPG, PNG or WEBP image and ask questions about it.</p><button data-plugin="image">Use image tool</button></div><div class="feature-card"><strong>🎙 Voice input</strong><p>Speak to type using your browser microphone (Chrome/Edge support).</p><button data-plugin="voice">Use voice input</button></div><div class="feature-card"><strong>🔊 Read aloud</strong><p>Listen to an OSAM AI answer using browser speech.</p></div><div class="feature-card"><strong>📄 Text and CSV reader</strong><p>Attach TXT, MD or CSV files to include their contents in your prompt.</p><button data-plugin="file">Choose a file</button></div><div class="feature-card"><strong>💾 Chat backup</strong><p>Export your saved conversations as a JSON backup.</p><button data-plugin="backup">Export chats</button></div><p class="feature-muted">External services such as Gmail, Calendar and other third-party plugins are not connected yet.</p>');

function showExplore() {
  openFeaturePanel("OSAM AI — 10 AI Tools", '<p class="feature-muted">Choose a tool to start. Tools use OSAM AI chat to create plans, drafts and code. Image/video rendering and automatic app deployment require additional integrations and are not enabled yet.</p><div class="feature-card"><strong>🧠 AI Brain</strong><p>Ask questions, understand ideas and get helpful answers.</p><button data-tool="brain">Open AI Brain</button></div><div class="feature-card"><strong>💻 AI App Builder</strong><p>Plan an app and generate starter code and setup steps.</p><button data-tool="app">Build an app</button></div><div class="feature-card"><strong>🌐 Website Builder</strong><p>Create website structure, design and HTML/CSS/JavaScript.</p><button data-tool="website">Build a website</button></div><div class="feature-card"><strong>🎮 Game Creator</strong><p>Design a small game and generate playable starter code.</p><button data-tool="game">Create a game</button></div><div class="feature-card"><strong>🎨 Image Creator</strong><p>Develop an image concept and a detailed generation prompt. Image rendering integration is not connected yet.</p><button data-tool="image">Create an image concept</button></div><div class="feature-card"><strong>🎬 Video Creator</strong><p>Write a video idea, script, scenes and storyboard. Video rendering is not connected yet.</p><button data-tool="video">Create a video plan</button></div><div class="feature-card"><strong>📱 Android App Creator</strong><p>Generate Android project code, files and build instructions.</p><button data-tool="android">Create an Android app</button></div><div class="feature-card"><strong>🔬 Research AI</strong><p>Explore a topic, organize findings and identify useful sources. Turn on web search for live research.</p><button data-tool="research">Start research</button></div><div class="feature-card"><strong>⚡ Code Assistant</strong><p>Write, explain, debug and improve Python, HTML, CSS and JavaScript.</p><button data-tool="code">Get coding help</button></div><div class="feature-card"><strong>🤖 AI Agent</strong><p>Break a goal into steps, plan actions and track progress in chat.</p><button data-tool="agent">Plan with AI Agent</button></div><div class="feature-card"><strong>🎙️ Voice</strong><p>Dictate prompts and listen to answers.</p><button data-explore="voice">Try Voice</button></div><div class="feature-card"><strong>⏰ Scheduled reminders</strong><p>Set reminders while the browser tab remains open.</p><button data-explore="scheduled">Create reminder</button></div><div class="feature-card"><strong>💾 Chat history and backup</strong><p>Your chats are saved in this browser. Export a backup from Library.</p></div>');
  const toolPrompts = {
    brain: "Act as OSAM AI Brain. Help me with this request: ",
    app: "Act as an AI App Builder. First ask me what app I want to build if I have not described it. Then provide a clear feature plan, recommended technology, project structure, starter code and setup instructions: ",
    website: "Act as a Website Builder. Ask for the website purpose and style if missing, then create a responsive website plan and complete HTML, CSS and JavaScript files: ",
    game: "Act as a Game Creator. Help me design a small playable game, then provide complete starter code and instructions to run it: ",
    image: "Act as an Image Creator. Help me develop the image concept and write a detailed prompt including subject, style, composition, lighting and aspect ratio. Note that image rendering is not currently connected in this OSAM AI website: ",
    video: "Act as a Video Creator. Develop a video concept, script, scene-by-scene storyboard, voiceover and prompts for a video generation tool. Note that video rendering is not currently connected: ",
    android: "Act as an Android App Creator. Ask what Android app I want, then provide a project structure, source files, permissions, build configuration and steps to build an APK or AAB: ",
    research: "Act as Research AI. Help me research this topic, separate established facts from uncertainty, organize findings and provide sources when web search is enabled: ",
    code: "Act as an expert Code Assistant. Help me write, explain, test and debug code. Ask for the code or error if needed: ",
    agent: "Act as OSAM AI Agent. Turn my goal into a step-by-step plan, identify what information or permissions are needed, and guide me through each step. Do not claim to perform actions you cannot access: "
  };
  featureContent.querySelectorAll("[data-tool]").forEach(button => button.addEventListener("click", () => {
    const prompt = toolPrompts[button.dataset.tool];
    if (!prompt) return;
    closeFeaturePanel();
    const composer = document.getElementById("messageInput");
    const chatForm = document.getElementById("chatForm");
    if (composer && chatForm) {
      composer.value = prompt;
      composer.focus();
      composer.dispatchEvent(new Event("input", { bubbles: true }));
    }
  }));
  featureContent.querySelector('[data-explore="voice"]')?.addEventListener("click",()=>{closeFeaturePanel();document.getElementById("micBtn")?.click();});
  featureContent.querySelector('[data-explore="scheduled"]')?.addEventListener("click",showScheduled);
}

/* FREE PROFILE MENU OPTIONS */
function closeProfileMenu() { if (profileMenu) profileMenu.hidden = true; }
function showUpgrade() {
  closeProfileMenu();
  openFeaturePanel("Upgrade plan", '<div class="feature-card"><strong>OSAM AI — Free plan</strong><p>Core chat, saved browser history, image questions (subject to Gemini availability), voice tools and local reminders are available without a subscription.</p></div><p class="feature-muted">A paid plan or payment checkout has not been configured for OSAM AI. No payment is required to use the current free features.</p>');
}
function showPersonalization() {
  closeProfileMenu();
  const saved=localStorage.getItem("osam-ai-language") || "auto";
  openFeaturePanel("Personalization", '<p class="feature-muted">Choose your preferred language for the OSAM AI interface and future personalization.</p><label class="feature-label" for="osamLanguage">Preferred language</label><select id="osamLanguage" class="feature-select"><option value="auto">Automatic</option><option value="gu">ગુજરાતી</option><option value="en">English</option><option value="hi">हिन्दी</option></select><button id="savePersonalization" class="feature-action">Save preference</button><p class="feature-muted">This preference is saved in this browser. OSAM AI may still follow the language of your message.</p>');
  const select=document.getElementById("osamLanguage"); select.value=saved;
  document.getElementById("savePersonalization").addEventListener("click",()=>{
    localStorage.setItem("osam-ai-language",select.value);
    alert("Personalization preference saved on this device.");
    closeFeaturePanel();
  });
}
function showProfileSettings() {
  closeProfileMenu();
  const current=localStorage.getItem("osam-ai-display-name") || document.getElementById("profileName")?.textContent || "OSAM AI";
  openFeaturePanel("Profile", '<p class="feature-muted">Change the display name shown in this browser.</p><label class="feature-label" for="osamDisplayName">Display name</label><input id="osamDisplayName" class="feature-input" maxlength="40" value=""><button id="saveDisplayName" class="feature-action">Save profile</button><p class="feature-muted">For signed-in accounts, this also updates your Firebase display name.</p>');
  document.getElementById("osamDisplayName").value=current;
  document.getElementById("saveDisplayName").addEventListener("click",async()=>{
    const name=document.getElementById("osamDisplayName").value.trim();
    if(!name){alert("Please enter a display name.");return;}
    localStorage.setItem("osam-ai-display-name",name);
    try { if(auth.currentUser) await updateProfile(auth.currentUser,{displayName:name}); } catch(e) { alert("Saved on this device, but account profile could not be updated: "+e.message); }
    document.getElementById("profileName").textContent=name;
    document.getElementById("menuProfileName").textContent=name;
    document.getElementById("profileAvatar").textContent=name.slice(0,1).toUpperCase();
    closeFeaturePanel();
  });
}
function showSettings() {
  closeProfileMenu();
  const row=(id,icon,title,detail="",right="›") =>
    '<button type="button" class="settings-row" data-setting="'+id+'"><span class="settings-row-icon">'+icon+'</span><span class="settings-row-copy"><strong>'+title+'</strong>'+(detail?'<small>'+detail+'</small>':'')+'</span><span class="settings-row-right">'+right+'</span></button>';
  const group=(items)=>'<div class="settings-group">'+items.join("")+'</div>';
  const page=(title,html)=>{openFeaturePanel(title,'<div class="settings-screen">'+html+'<button type="button" class="settings-back" id="settingsBack">‹ Back to Settings</button></div>');document.getElementById("settingsBack")?.addEventListener("click",showSettings);};
  const stored=(key,def=false)=>localStorage.getItem("osam-setting-"+key)===null?def:localStorage.getItem("osam-setting-"+key)==="true";
  const toggle=(key,label,desc="",def=false)=>'<label class="settings-toggle-row"><span><strong>'+label+'</strong>'+(desc?'<small>'+desc+'</small>':'')+'</span><input type="checkbox" data-pref="'+key+'" '+(stored(key,def)?"checked":"")+'></label>';
  const select=(key,label,values,def)=>'<label class="settings-choice-row"><span>'+label+'</span><select data-pref-select="'+key+'">'+values.map(v=>'<option '+((localStorage.getItem("osam-setting-"+key)||def)===v[0]?'selected':'')+' value="'+v[0]+'">'+v[1]+'</option>').join("")+'</select></label>';
  const bindPrefs=()=>{document.querySelectorAll("#featureContent [data-pref]").forEach(el=>el.addEventListener("change",()=>localStorage.setItem("osam-setting-"+el.dataset.pref,String(el.checked))));document.querySelectorAll("#featureContent [data-pref-select]").forEach(el=>el.addEventListener("change",()=>localStorage.setItem("osam-setting-"+el.dataset.prefSelect,el.value)));};
  const simple=(title,body)=>page(title,'<div class="settings-group settings-detail-group">'+body+'</div>');
  openFeaturePanel("Settings",
    '<div class="settings-screen">'+
    group([
      row("account","◉","Account",document.getElementById("menuProfileEmail")?.textContent||"Your OSAM AI account"),
      row("workspace","▢","Workspace","Personal"),
      row("verify","▣","Verify age"),
      row("upgrade","✧","Upgrade to OSAM AI","Explore available plans")
    ])+
    '<button type="button" class="settings-feature-card" data-setting="customize"><span class="settings-row-icon">♙</span><span><strong>Customize OSAM AI</strong><small>Personality, memory and preferences</small></span><span>›</span></button>'+
    group([
      row("general","⚙","General"),row("usage","▣","Usage and limits"),row("notifications","♧","Notifications"),row("voice","♫","Voice"),row("safety","⬡","Safety"),row("security","▣","Security and login"),row("codex","✿","Codex"),row("storage","▱","Storage"),row("privacy","⬡","Privacy center"),row("history","▤","History and data"),row("ads","⚑","Ads controls")
    ])+
    '<button type="button" class="settings-logout" data-setting="logout">⇥ &nbsp; Log out</button></div>');
  document.getElementById("featureContent").querySelectorAll("[data-setting]").forEach(btn=>btn.addEventListener("click",()=>{
    const key=btn.dataset.setting;
    if(key==="logout"){document.getElementById("logoutBtn")?.click();return;}
    if(key==="account"){showProfileSettings();return;}
    if(key==="customize"){showPersonalization();return;}
    if(key==="upgrade"){showUpgrade();return;}
    if(key==="general"){
      const current=localStorage.getItem("osam-ai-theme")||"dark";
      page("General",
        select("appearance","Appearance",[["system","System"],["light","Light"],["dark","Dark"]],current)+
        select("accent","Accent color",[["system","System"],["blue","Blue"],["green","Green"],["purple","Purple"],["orange","Orange"]],"system")+
        '<label class="settings-choice-row"><span>Nickname</span><input class="settings-inline-input" id="settingsNickname" maxlength="40" placeholder="Add a nickname" value="'+(localStorage.getItem("osam-ai-nickname")||"")+'"></label>'+
        select("app-language","App language",[["auto","Automatic"],["en","English"],["gu","ગુજરાતી"],["hi","हिन्दी"]],"auto")+
        toggle("reference-photos","Reference photos","Allow photos to be used as reference",true)+toggle("haptics","Haptic feedback","Vibration on supported devices",true)+
        select("intelligence","Intelligence",[["standard","Standard"],["visual","Visual answers"]],"visual")+
        toggle("homepage-suggestions","Homepage suggestions","Show suggestions on the home screen",true)+toggle("web-search","Web search","Allow web search when requested",true)+toggle("library-search","Library search","Search your saved library",true));
      bindPrefs();
      document.getElementById("settingsNickname")?.addEventListener("change",e=>localStorage.setItem("osam-ai-nickname",e.target.value.trim()));
      document.querySelector('[data-pref-select="appearance"]')?.addEventListener("change",e=>{if(e.target.value!=="system"){localStorage.setItem("osam-ai-theme",e.target.value);document.body.classList.toggle("osam-light",e.target.value==="light");}});
      return;
    }
    if(key==="notifications"){
      simple("Notifications",toggle("notify-codex","Codex", "",false)+toggle("notify-groups","Group chats","",false)+toggle("notify-health","Health","",false)+toggle("notify-library","Library","",false)+toggle("notify-marketing","Marketing","",false)+toggle("notify-tips","Personalized tips","",false)+toggle("notify-projects","Projects","",false)+toggle("notify-responses","Responses","",true)+toggle("notify-tasks","Tasks","",true)+toggle("notify-usage","Usage","",false));bindPrefs();return;
    }
    if(key==="voice"){
      simple("Voice",select("voice-model","Model",[["live","Live"],["standard","Standard"]],"live")+select("voice-choice","Voice",[["alloy","Alloy"],["echo","Echo"],["shimmer","Shimmer"],["verse","Verse"]],"alloy")+select("voice-language","Language",[["auto","Automatic"],["en","English"],["gu","Gujarati"],["hi","Hindi"]],"auto")+toggle("voice-dictionary","Dictionary","Use saved pronunciation preferences",false)+toggle("voice-history","Dictation history","Save dictation history on this device",false)+toggle("background-voice","Background conversations","",false)+toggle("default-assistant","Use as default assistant","Browser support may vary",false));bindPrefs();return;
    }
    if(key==="safety"){
      simple("Safety",toggle("reduce-sensitive","Reduce sensitive content","",false)+'<div class="settings-info-row"><strong>Trusted contact</strong><small>Trusted contact features are not connected in OSAM AI.</small></div><div class="settings-info-row"><strong>Parental controls</strong><small>Family controls are not available in this app.</small></div>');bindPrefs();return;
    }
    if(key==="security"){
      simple("Security and login",toggle("extra-security","Require extra security challenge","Local preference only; does not change Firebase sign-in.",false)+'<div class="settings-info-row"><strong>Sessions</strong><small>Manage active sessions from your Google or Firebase account.</small></div><div class="settings-info-row"><strong>Device unlock</strong><small>Not supported by this app yet.</small></div><div class="settings-info-row"><strong>Security history</strong><small>Authentication events are managed by Firebase.</small></div><div class="settings-info-row"><strong>Advanced security</strong><small>Not available in this version.</small></div><div class="settings-info-row"><strong>Lockdown mode</strong><small>Not available in this version.</small></div>');bindPrefs();return;
    }
    if(key==="history"){
      simple("History and data",'<div class="settings-info-row"><strong>Chat history</strong><small>Your chats are stored in this browser.</small></div><button class="settings-danger-action" id="clearChatHistory">Clear chat history on this device</button><div class="settings-info-row"><strong>Archived chats</strong><small>Chat archiving is not currently supported.</small></div>'+toggle("include-audio","Include audio recordings","Voice recording storage is not implemented.",false));
      document.getElementById("clearChatHistory")?.addEventListener("click",()=>{if(confirm("Delete all saved OSAM AI chats from this browser?")){localStorage.removeItem("osam-ai-chats");localStorage.removeItem("warrior-ai-chats");location.reload();}});bindPrefs();return;
    }
    if(key==="ads"){
      simple("Ads controls",'<div class="settings-info-row"><strong>Ads data</strong><small>OSAM AI does not currently provide ad personalization controls.</small></div><div class="settings-info-row"><strong>History and topics</strong><small>No advertising profile is maintained by this app.</small></div><button class="settings-danger-action" id="clearAdsData">Clear local ads preferences</button><div class="settings-info-row"><strong>Ad-free plan</strong><small>Subscription management is not connected yet.</small></div>');
      document.getElementById("clearAdsData")?.addEventListener("click",()=>{Object.keys(localStorage).filter(k=>k.startsWith("osam-setting-ad")).forEach(k=>localStorage.removeItem(k));alert("Local advertising preferences cleared.");});return;
    }
    const info={
      workspace:["Workspace","Personal workspace is selected. Team workspaces are not connected yet."],
      verify:["Verify age","Age verification is not implemented in OSAM AI."],
      usage:["Usage and limits","Live usage and credit limits are not currently connected to the AI provider."],
      codex:["Codex","Codex integration is not available in this OSAM AI version."],
      storage:["Storage","Chat history and preferences are stored locally in this browser. Browser storage controls are managed by your browser."],
      privacy:["Privacy center","Privacy export and account deletion controls are not yet available. Contact support for help."]
    };
    const item=info[key]||["Settings","This option is not available yet."];
    simple(item[0],'<div class="settings-info-row"><strong>'+item[1]+'</strong></div>');
  }));
}

  openFeaturePanel("Help", '<div class="feature-card"><strong>How do I chat?</strong><p>Type your question in the message box and press Send.</p></div><div class="feature-card"><strong>How do I use images?</strong><p>Choose Images or Add photos, select a JPG, PNG or WEBP image, then ask a question.</p></div><div class="feature-card"><strong>Where are my old chats?</strong><p>Saved chats appear under Recents in this browser. They are not automatically synced between devices.</p></div><div class="feature-card"><strong>Why did AI not answer?</strong><p>The free AI service can be busy or reach usage limits. Try again later.</p></div><div class="feature-card osam-support-card"><strong>Need more help?</strong><p>If you face any problem with OSAM AI, email our support address. Include a screenshot and describe what happened.</p><a class="osam-support-email" href="mailto:aditchauhan2212@gmail.com?subject=OSAM%20AI%20Support%20Request&body=Hello%20OSAM%20AI%20Support%2C%0A%0AI%20need%20help%20with%3A%0A%0ADevice%3A%0ABrowser%3A%0AError%20or%20problem%3A%0A">aditchauhan2212@gmail.com</a><button type="button" class="feature-action" id="copySupportEmail">Copy support email</button></div>');
  document.getElementById("copySupportEmail")?.addEventListener("click", async () => {

    catch (_) { window.prompt("Copy support email:", "aditchauhan2212@gmail.com"); }
  });
}
