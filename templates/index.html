
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OSAM AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}?v=20261116d">
</head>

<body>

<div class="app" id="appShell">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <button class="brand" id="brandMenu" type="button">
                <span>OSAM AI</span>
                <span class="brand-arrow">⌄</span>
            </button>

            <button class="sidebar-toggle" id="collapseBtn" type="button">
                ◫
            </button>

        </div>

        <!-- NAVIGATION -->
        <nav class="sidebar-nav">

            <button class="nav-item" id="newChatBtn" type="button">
                <span class="nav-icon">✎</span>
                <span>New chat</span>
            </button>

            <button class="nav-item" id="imagesBtn" type="button">
                <span class="nav-icon">▧</span>
                <span>Images</span>
            </button>

            <button class="nav-item" id="scheduledBtn" type="button">
                <span class="nav-icon">◷</span>
                <span>Scheduled</span>
            </button>

            <button class="nav-item" id="libraryBtn" type="button">
                <span class="nav-icon">▤</span>
                <span>Library</span>
            </button>

            <button class="nav-item" id="pluginsBtn" type="button">
                <span class="nav-icon">◎</span>
                <span>Plugins</span>
            </button>

            <button class="nav-item" id="exploreBtn" type="button">
                <span class="nav-icon">•••</span>
                <span>Explore</span>
            </button>

        </nav>

        <!-- PROJECTS -->
        <section class="sidebar-section">

            <h3>Projects</h3>

            <div id="projectsList">
                <p class="empty-text">No projects</p>
            </div>

        </section>

        <!-- RECENTS -->
        <section class="sidebar-section recents-section">

            <h3>Recents</h3>

            <div class="chat-history" id="chatHistory">

                <p class="empty-text">
                    Your recent chats will appear here
                </p>

            </div>

        </section>

        <!-- PROFILE -->
        <div class="sidebar-bottom">

            <button class="profile-trigger"
                    id="profileTrigger"
                    type="button">

                <div class="profile-avatar" id="profileAvatar">
                    OS
                </div>

                <div class="profile-details">

                    <strong id="profileName">OSAM AI</strong>

                    <small id="userEmail">Free</small>

                </div>

                <span class="upgrade-btn">Upgrade</span>

            </button>

        </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">

            <button class="mobile-menu" id="menuBtn" type="button">
                ☰
            </button>

            <div class="mobile-brand">
                OSAM AI
            </div>

            <div class="topbar-right" id="guestActions">

                <button class="login-btn" id="loginBtn" type="button">
                    Log in
                </button>

                <button class="signup-btn" id="signupBtn" type="button">
                    Sign up for free
                </button>

            </div>

            <div class="topbar-right" id="userActions" hidden>

                <button class="user-menu-btn"
                        id="userMenuBtn"
                        type="button">
                    OSAM AI
                </button>

            </div>

        </header>


        <!-- CHAT AREA -->
        <section class="chat-area" id="chatArea">
    <div class="welcome-screen" id="welcomeScreen">
        <h1>Where should we begin?</h1>
        <div class="suggestions">
            <button class="suggestion" type="button" data-prompt="What can you do?">What can you do?</button>
        </div>
    </div>
    <div class="messages" id="chatMessages"></div>
</section>

<div class="composer-dock">
    <form class="input-box" id="chatForm">
        <div class="attach-wrapper">
            <button type="button" class="add-btn" id="addBtn" aria-label="Add attachment">+</button>
            <div class="attach-menu" id="attachMenu" hidden>
                <button type="button" id="imageUploadBtn">🖼️ <span>Add photos</span></button>
                <button type="button" id="fileUploadBtn">📎 <span>Upload file</span></button>
                <button type="button" id="cameraUploadBtn">📷 <span>Use camera</span></button>
                <button type="button" id="documentUploadBtn">📄 <span>Add document</span></button>
            </div>
            <input type="file" id="imagePicker" accept="image/*" hidden>
            <input type="file" id="filePicker" hidden>
            <input type="file" id="cameraPicker" accept="image/*" capture="environment" hidden>
            <input type="file" id="documentPicker" accept=".pdf,.doc,.docx,.txt" hidden>
        </div>
        <textarea id="messageInput" rows="1" placeholder="Message OSAM AI..." required></textarea>
        <button type="button" class="mic-btn" id="micBtn" aria-label="Voice input">♩</button>
        <button type="button" class="stop-btn" id="stopButton" aria-label="Stop generating" hidden>■</button>
        <button type="submit" class="send-btn" id="sendButton" aria-label="Send message">↑</button>
    </form>
    <footer class="input-footer">OSAM AI can make mistakes. Check important information.</footer>
</div>

</main>
</div>


<!-- PROFILE MENU -->
<div class="profile-menu" id="profileMenu" hidden>

    <div class="profile-menu-user">

        <div class="profile-avatar">OS</div>

        <div>
            <strong id="menuProfileName">OSAM AI</strong>
            <small id="menuProfileEmail">Free</small>
        </div>

        <span class="menu-arrow">›</span>

    </div>

    <hr>

    <button class="profile-menu-item" id="upgradeBtn" type="button">
        ✧ &nbsp; Upgrade plan
    </button>

    <button class="profile-menu-item"
            id="personalizationBtn"
            type="button">
        ◷ &nbsp; Personalization
    </button>

    <button class="profile-menu-item"
            id="profileSettingsBtn"
            type="button">
        ◎ &nbsp; Profile
    </button>

    <button class="profile-menu-item" id="settingsBtn" type="button">
        ⚙ &nbsp; Settings
    </button>

    <hr>

    <button class="profile-menu-item" id="helpBtn" type="button">
        ◎ &nbsp; Help
        <span class="menu-arrow">›</span>
    </button>

    <button class="profile-menu-item" id="logoutBtn" type="button">
        ⇥ &nbsp; Log out
    </button>

</div>


<!-- AUTHENTICATION MODAL -->
<div id="authScreen" hidden>

    <div class="auth-card">

        <button type="button"
                id="closeAuth"
                class="close-auth">
            ×
        </button>

        <div class="auth-logo">

            <img
                class="osam-logo"
                src="{{ url_for('static', filename='osam-logo.png') }}"
                alt="OSAM AI Logo">

        </div>

        <h1>OSAM AI</h1>

        <p id="authHeading">
            Welcome Back! Login to continue.
        </p>

        <form id="authForm">

            <input
                type="email"
                id="authEmail"
                placeholder="Email Address"
                autocomplete="email"
                required>

            <input
                type="password"
                id="authPassword"
                placeholder="Password (minimum 6 characters)"
                autocomplete="current-password"
                minlength="6"
                required>

            <button type="submit" id="authSubmit">
                Login
            </button>

        </form>

        <button type="button" id="switchAuth">
            Don't have an account? Sign Up
        </button>

        <button type="button" id="googleLogin">
            G &nbsp; Continue with Google
        </button>

        <p id="authMessage" role="alert"></p>

    </div>

</div>


<!-- FIREBASE AUTHENTICATION -->
<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyDPDu9hSGrc9XzRnN8yUEvOKn6nhESiZd4",

    authDomain: "osam-ai.firebaseapp.com",

    projectId: "osam-ai",

    storageBucket: "osam-ai.firebasestorage.app",

    messagingSenderId: "576897627046",

    appId: "1:576897627046:web:6e5d3a8b1367e8637f1567",

    measurementId: "G-CPJKPCMNKR"

};


const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);

const googleProvider = new GoogleAuthProvider();


/* ELEMENTS */

const authScreen = document.getElementById("authScreen");
const authForm = document.getElementById("authForm");
const authEmail = document.getElementById("authEmail");
const authPassword = document.getElementById("authPassword");
const authSubmit = document.getElementById("authSubmit");
const authHeading = document.getElementById("authHeading");
const authMessage = document.getElementById("authMessage");
const switchAuth = document.getElementById("switchAuth");
const googleLogin = document.getElementById("googleLogin");

const guestActions = document.getElementById("guestActions");
const userActions = document.getElementById("userActions");

const profileMenu = document.getElementById("profileMenu");
const profileTrigger = document.getElementById("profileTrigger");

let isSignup = false;


/* LOGIN */

function openLogin() {

    isSignup = false;

    authHeading.textContent =
        "Welcome Back! Login to continue.";

    authSubmit.textContent = "Login";

    switchAuth.textContent =
        "Don't have an account? Sign Up";

    authPassword.autocomplete = "current-password";

    authMessage.textContent = "";

    authScreen.hidden = false;

}


/* SIGNUP */

function openSignup() {

    isSignup = true;

    authHeading.textContent =
        "Create your OSAM AI account";

    authSubmit.textContent = "Create Account";

    switchAuth.textContent =
        "Already have an account? Login";

    authPassword.autocomplete = "new-password";

    authMessage.textContent = "";

    authScreen.hidden = false;

}


/* AUTH BUTTONS */

document.getElementById("loginBtn")
    .addEventListener("click", openLogin);

document.getElementById("signupBtn")
    .addEventListener("click", openSignup);

document.getElementById("closeAuth")
    .addEventListener("click", () => {

        authScreen.hidden = true;

    });


/* SWITCH AUTH */

switchAuth.addEventListener("click", () => {

    isSignup = !isSignup;

    authMessage.textContent = "";

    authHeading.textContent = isSignup
        ? "Create your OSAM AI account"
        : "Welcome Back! Login to continue.";

    authSubmit.textContent = isSignup
        ? "Create Account"
        : "Login";

    switchAuth.textContent = isSignup
        ? "Already have an account? Login"
        : "Don't have an account? Sign Up";

    authPassword.autocomplete =
        isSignup ? "new-password" : "current-password";

});


/* EMAIL LOGIN / SIGNUP */

authForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    authMessage.textContent = "";

    authSubmit.disabled = true;

    try {

        const email = authEmail.value.trim();

        const password = authPassword.value;

        if (isSignup) {

            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        } else {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }

    } catch (error) {

        authMessage.textContent =
            error.message.replace("Firebase: ", "");

    } finally {

        authSubmit.disabled = false;

    }

});


/* GOOGLE LOGIN */

googleLogin.addEventListener("click", async () => {

    authMessage.textContent = "";

    googleLogin.disabled = true;

    try {

        await signInWithPopup(auth, googleProvider);

    } catch (error) {

        authMessage.textContent =
            error.message.replace("Firebase: ", "");

    } finally {

        googleLogin.disabled = false;

    }

});


/* AUTH STATE */

onAuthStateChanged(auth, (user) => {

    if (user) {

        guestActions.hidden = true;

        userActions.hidden = false;

        authScreen.hidden = true;

        document.getElementById("userEmail").textContent =
            user.email || "Signed in";

        document.getElementById("menuProfileEmail").textContent =
            user.email || "Signed in";

        document.getElementById("profileName").textContent =
            user.displayName || "OSAM AI";

        document.getElementById("menuProfileName").textContent =
            user.displayName || "OSAM AI";

        const initial = user.displayName
            ? user.displayName.charAt(0).toUpperCase()
            : "OS";

        document.getElementById("profileAvatar").textContent =
            initial;

    } else {

        guestActions.hidden = false;

        userActions.hidden = true;

        authScreen.hidden = true;

        document.getElementById("userEmail").textContent = "Free";

        document.getElementById("profileName").textContent = "OSAM AI";

    }

});


/* LOGOUT */

document.getElementById("logoutBtn")
    .addEventListener("click", async () => {

        try {

            await signOut(auth);

            profileMenu.hidden = true;

        } catch (error) {

            alert("Logout failed. Please try again.");

        }

    });


/* PROFILE MENU */

profileTrigger.addEventListener("click", (event) => {

    event.stopPropagation();

    profileMenu.hidden = !profileMenu.hidden;

});


document.addEventListener("click", (event) => {

    if (
        !profileMenu.contains(event.target) &&
        !profileTrigger.contains(event.target) &&
        !document.getElementById("userMenuBtn").contains(event.target)
    ) {

        profileMenu.hidden = true;

    }

});


/* COLLAPSE SIDEBAR */

document.getElementById("collapseBtn")
    .addEventListener("click", () => {

        document.getElementById("sidebar")
            .classList.toggle("collapsed");

    });


/* NAVIGATION PLACEHOLDERS */

const navMessages = {

    images: "Images feature will be added soon.",

    scheduled: "Scheduled tasks feature will be added soon.",

    library: "Your library will appear here.",

    plugins: "OSAM AI plugins will appear here.",

    explore: "Explore OSAM AI features."

};


[
    ["imagesBtn", "images"],
    ["scheduledBtn", "scheduled"],
    ["libraryBtn", "library"],
    ["pluginsBtn", "plugins"],
    ["exploreBtn", "explore"]

].forEach(([id, key]) => {

    document.getElementById(id)
        .addEventListener("click", () => {

            alert(navMessages[key]);

        });

});


/* PROFILE OPTIONS */

[
    "upgradeBtn",
    "personalizationBtn",
    "profileSettingsBtn",
    "settingsBtn",
    "helpBtn"

].forEach((id) => {

    document.getElementById(id)
        .addEventListener("click", () => {

            alert("This OSAM AI feature will be added soon.");

        });

});


/* USER MENU BUTTON */

document.getElementById("userMenuBtn")
    .addEventListener("click", (event) => {

        event.stopPropagation();

        profileMenu.hidden = !profileMenu.hidden;

    });

</script>


<!-- MAIN CHAT JAVASCRIPT -->
<script src="{{ url_for('static', filename='app.js') }}?v=20261116e"></script>

</body>
</html>
