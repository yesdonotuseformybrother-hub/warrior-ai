<!-- FIREBASE AUTHENTICATION -->
<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut,
    updateProfile
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyDPDu9hSGrc9XzRnN8yUEvOKn6nhESiZd4",

    authDomain: "osam-ai.firebaseapp.com",

    projectId: "osam-ai",

    storageBucket: "osam-ai.firebasestorage.app",

    messagingSenderId: "576897627046",

    appId: "1:576897627046:web:6e5d3a8b1367e8637f1567",

    measurementId: "G-CPJKPCMNKR"

};


const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);

const googleProvider = new GoogleAuthProvider();


/* ELEMENTS */

const authScreen = document.getElementById("authScreen");
const authForm = document.getElementById("authForm");
const authEmail = document.getElementById("authEmail");
const authPassword = document.getElementById("authPassword");
const authSubmit = document.getElementById("authSubmit");
const authHeading = document.getElementById("authHeading");
const authMessage = document.getElementById("authMessage");
const switchAuth = document.getElementById("switchAuth");
const googleLogin = document.getElementById("googleLogin");

const guestActions = document.getElementById("guestActions");
const userActions = document.getElementById("userActions");

const profileMenu = document.getElementById("profileMenu");
const profileTrigger = document.getElementById("profileTrigger");

let isSignup = false;


/* LOGIN */

function openLogin() {

    isSignup = false;

    authHeading.textContent =
        "Welcome Back! Login to continue.";

    authSubmit.textContent = "Login";

    switchAuth.textContent =
        "Don't have an account? Sign Up";

    authPassword.autocomplete = "current-password";

    authMessage.textContent = "";

    authScreen.hidden = false;

}


/* SIGNUP */

function openSignup() {

    isSignup = true;

    authHeading.textContent =
        "Create your OSAM AI account";

    authSubmit.textContent = "Create Account";

    switchAuth.textContent =
        "Already have an account? Login";

    authPassword.autocomplete = "new-password";

    authMessage.textContent = "";

    authScreen.hidden = false;

}


/* AUTH BUTTONS */

document.getElementById("loginBtn")
    .addEventListener("click", openLogin);

document.getElementById("signupBtn")
    .addEventListener("click", openSignup);

document.getElementById("closeAuth")
    .addEventListener("click", () => {

        authScreen.hidden = true;

    });


/* SWITCH AUTH */

switchAuth.addEventListener("click", () => {

    isSignup = !isSignup;

    authMessage.textContent = "";

    authHeading.textContent = isSignup
        ? "Create your OSAM AI account"
        : "Welcome Back! Login to continue.";

    authSubmit.textContent = isSignup
        ? "Create Account"
        : "Login";

    switchAuth.textContent = isSignup
        ? "Already have an account? Login"
        : "Don't have an account? Sign Up";

    authPassword.autocomplete =
        isSignup ? "new-password" : "current-password";

});


/* EMAIL LOGIN / SIGNUP */

authForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    authMessage.textContent = "";

    authSubmit.disabled = true;

    try {

        const email = authEmail.value.trim();

        const password = authPassword.value;

        if (isSignup) {

            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        } else {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }

    } catch (error) {

        authMessage.textContent =
            error.message.replace("Firebase: ", "");

    } finally {

        authSubmit.disabled = false;

    }

});


/* GOOGLE LOGIN */

googleLogin.addEventListener("click", async () => {

    authMessage.textContent = "";

    googleLogin.disabled = true;

    try {

        await signInWithPopup(auth, googleProvider);

    } catch (error) {

        authMessage.textContent =
            error.message.replace("Firebase: ", "");

    } finally {

        googleLogin.disabled = false;

    }

});


/* AUTH STATE */

onAuthStateChanged(auth, (user) => {

    if (user) {

        guestActions.hidden = true;

        userActions.hidden = false;

        authScreen.hidden = true;

        document.getElementById("userEmail").textContent =
            user.email || "Signed in";

        document.getElementById("menuProfileEmail").textContent =
            user.email || "Signed in";

        document.getElementById("profileName").textContent =
            user.displayName || "OSAM AI";

        document.getElementById("menuProfileName").textContent =
            user.displayName || "OSAM AI";

        const initial = user.displayName
            ? user.displayName.charAt(0).toUpperCase()
            : "OS";

        document.getElementById("profileAvatar").textContent =
            initial;

    } else {

        guestActions.hidden = false;

        userActions.hidden = true;

        authScreen.hidden = true;

        document.getElementById("userEmail").textContent = "Free";

        document.getElementById("profileName").textContent = "OSAM AI";

    }

});


/* LOGOUT */

document.getElementById("logoutBtn")
    .addEventListener("click", async () => {

        try {

            await signOut(auth);

            profileMenu.hidden = true;

        } catch (error) {

            alert("Logout failed. Please try again.");

        }

    });


/* PROFILE MENU */

profileTrigger.addEventListener("click", (event) => {

    event.stopPropagation();

    profileMenu.hidden = !profileMenu.hidden;

});


document.addEventListener("click", (event) => {

    if (
        !profileMenu.contains(event.target) &&
        !profileTrigger.contains(event.target) &&
        !document.getElementById("userMenuBtn").contains(event.target)
    ) {

        profileMenu.hidden = true;

    }

});


/* FREE SCHEDULED, PLUGINS AND EXPLORE PANELS */
const featureModal = document.getElementById("featureModal");
const featureTitle = document.getElementById("featureTitle");
const featureContent = document.getElementById("featureContent");
const scheduledKey = "osam-ai-scheduled-reminders";
let reminderTimers = [];

function closeFeaturePanel() { featureModal.hidden = true; }
document.getElementById("featureClose")?.addEventListener("click", closeFeaturePanel);
featureModal?.addEventListener("click", e => { if (e.target === featureModal) closeFeaturePanel(); });

function openFeaturePanel(title, html) {
  featureTitle.textContent = title;
  featureContent.innerHTML = html;
  featureModal.hidden = false;
}
function readScheduled() {
  try { return JSON.parse(localStorage.getItem(scheduledKey) || "[]"); }
  catch (_) { return []; }
}
function saveScheduled(items) { localStorage.setItem(scheduledKey, JSON.stringify(items)); }
function armReminders() {
  reminderTimers.forEach(clearTimeout); reminderTimers = [];
  const now = Date.now();
  readScheduled().forEach(item => {
    const delay = new Date(item.when).getTime() - now;
    if (delay > 0 && delay < 2147480000) {
      reminderTimers.push(setTimeout(() => {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("OSAM AI reminder", { body: item.text });
        } else { alert("OSAM AI reminder: " + item.text); }
        saveScheduled(readScheduled().filter(x => x.id !== item.id));
        if (!featureModal.hidden && featureTitle.textContent === "Scheduled") showScheduled();
      }, delay));
    }
  });
}
function showScheduled() {
  const items = readScheduled().sort((a,b) => new Date(a.when)-new Date(b.when));
  const rows = items.map(item => '<div class="scheduled-row"><div><strong></strong><small></small></div><button type="button" data-remove-reminder="'+item.id+'">Delete</button></div>').join("");
  openFeaturePanel("Scheduled", '<p class="feature-muted">Create a free reminder. It can notify you while this website is open; keep the tab open for reliable alerts.</p><form id="reminderForm" class="reminder-form"><label>What should OSAM AI remind you about?</label><input id="reminderText" maxlength="180" required placeholder="e.g. Study for 30 minutes"><label>Date and time</label><input id="reminderWhen" type="datetime-local" required><button type="submit">＋ Add reminder</button></form><h3>Your reminders</h3><div id="reminderList">'+(rows || '<p class="feature-muted">No reminders yet.</p>')+'</div>');
  items.forEach((item,i) => {
    const row=featureContent.querySelectorAll(".scheduled-row")[i];
    if(row){row.querySelector("strong").textContent=item.text;row.querySelector("small").textContent=new Date(item.when).toLocaleString();}
  });
  featureContent.querySelectorAll("[data-remove-reminder]").forEach(btn=>btn.addEventListener("click",()=>{
    saveScheduled(readScheduled().filter(x=>x.id!==btn.dataset.removeReminder)); showScheduled(); armReminders();
  }));
  document.getElementById("reminderForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const textValue=document.getElementById("reminderText").value.trim();
    const when=document.getElementById("reminderWhen").value;
    if(!textValue || new Date(when).getTime()<=Date.now()){alert("Please choose a future date and time.");return;}
    if("Notification" in window && Notification.permission==="default"){try{await Notification.requestPermission();}catch(_){}}
    const items=readScheduled(); items.push({id:Date.now().toString(),text:textValue,when}); saveScheduled(items); armReminders(); showScheduled();
  });
}
function showPlugins() {
  openFeaturePanel("Plugins", '<p class="feature-muted">Free tools already built into OSAM AI. No paid plugin subscription required.</p><div class="feature-card"><strong>📷 Image understanding</strong><p>Attach a JPG, PNG or WEBP image and ask questions about it.</p><button data-plugin="image">Use image tool</button></div><div class="feature-card"><strong>🎙 Voice input</strong><p>Speak to type using your browser microphone (Chrome/Edge support).</p><button data-plugin="voice">Use voice input</button></div><div class="feature-card"><strong>🔊 Read aloud</strong><p>Listen to an OSAM AI answer using browser speech.</p></div><div class="feature-card"><strong>📄 Text and CSV reader</strong><p>Attach TXT, MD or CSV files to include their contents in your prompt.</p><button data-plugin="file">Choose a file</button></div><div class="feature-card"><strong>💾 Chat backup</strong><p>Export your saved conversations as a JSON backup.</p><button data-plugin="backup">Export chats</button></div><p class="feature-muted">External services such as Gmail, Calendar and other third-party plugins are not connected yet.</p>');
  featureContent.querySelector('[data-plugin="image"]')?.addEventListener("click",()=>{closeFeaturePanel();document.getElementById("imagePicker")?.click();});
  featureContent.querySelector('[data-plugin="voice"]')?.addEventListener("click",()=>{closeFeaturePanel();document.getElementById("micBtn")?.click();});
  featureContent.querySelector('[data-plugin="file"]')?.addEventListener("click",()=>{closeFeaturePanel();document.getElementById("filePicker")?.click();});
  featureContent.querySelector('[data-plugin="backup"]')?.addEventListener("click",()=>document.getElementById("libraryBtn")?.click());
}
function showExplore() {
  openFeaturePanel("Explore OSAM AI", '<p class="feature-muted">Explore the free features currently available.</p><div class="feature-card"><strong>Chat with AI</strong><p>Ask questions, write, translate, summarize and get coding help.</p></div><div class="feature-card"><strong>Images</strong><p>Upload an image and ask OSAM AI to describe or explain it.</p><button data-explore="image">Try Images</button></div><div class="feature-card"><strong>Voice</strong><p>Dictate prompts and listen to answers.</p><button data-explore="voice">Try Voice</button></div><div class="feature-card"><strong>Scheduled reminders</strong><p>Set reminders while the browser tab remains open.</p><button data-explore="scheduled">Create reminder</button></div><div class="feature-card"><strong>Chat history and backup</strong><p>Your chats are saved in this browser. Export a backup from Library.</p></div>');
  featureContent.querySelector('[data-explore="image"]')?.addEventListener("click",()=>{closeFeaturePanel();document.getElementById("imagePicker")?.click();});
  featureContent.querySelector('[data-explore="voice"]')?.addEventListener("click",()=>{closeFeaturePanel();document.getElementById("micBtn")?.click();});
  featureContent.querySelector('[data-explore="scheduled"]')?.addEventListener("click",showScheduled);
}
document.getElementById("scheduledBtn")?.addEventListener("click",showScheduled);
document.getElementById("pluginsBtn")?.addEventListener("click",showPlugins);
document.getElementById("exploreBtn")?.addEventListener("click",showExplore);
document.getElementById("imagesBtn")?.addEventListener("click",()=>document.getElementById("imagePicker")?.click());
armReminders();


/* FREE PROFILE MENU OPTIONS */
function closeProfileMenu() { if (profileMenu) profileMenu.hidden = true; }
function showUpgrade() {
  closeProfileMenu();
  openFeaturePanel("Upgrade plan", '<div class="feature-card"><strong>OSAM AI — Free plan</strong><p>Core chat, saved browser history, image questions (subject to Gemini availability), voice tools and local reminders are available without a subscription.</p></div><p class="feature-muted">A paid plan or payment checkout has not been configured for OSAM AI. No payment is required to use the current free features.</p>');
}
function showPersonalization() {
  closeProfileMenu();
  const saved=localStorage.getItem("osam-ai-language") || "auto";
  openFeaturePanel("Personalization", '<p class="feature-muted">Choose your preferred language for the OSAM AI interface and future personalization.</p><label class="feature-label" for="osamLanguage">Preferred language</label><select id="osamLanguage" class="feature-select"><option value="auto">Automatic</option><option value="gu">ગુજરાતી</option><option value="en">English</option><option value="hi">हिन्दी</option></select><button id="savePersonalization" class="feature-action">Save preference</button><p class="feature-muted">This preference is saved in this browser. OSAM AI may still follow the language of your message.</p>');
  const select=document.getElementById("osamLanguage"); select.value=saved;
  document.getElementById("savePersonalization").addEventListener("click",()=>{
    localStorage.setItem("osam-ai-language",select.value);
    alert("Personalization preference saved on this device.");
    closeFeaturePanel();
  });
}
function showProfileSettings() {
  closeProfileMenu();
  const current=localStorage.getItem("osam-ai-display-name") || document.getElementById("profileName")?.textContent || "OSAM AI";
  openFeaturePanel("Profile", '<p class="feature-muted">Change the display name shown in this browser.</p><label class="feature-label" for="osamDisplayName">Display name</label><input id="osamDisplayName" class="feature-input" maxlength="40" value=""><button id="saveDisplayName" class="feature-action">Save profile</button><p class="feature-muted">For signed-in accounts, this also updates your Firebase display name.</p>');
  document.getElementById("osamDisplayName").value=current;
  document.getElementById("saveDisplayName").addEventListener("click",async()=>{
    const name=document.getElementById("osamDisplayName").value.trim();
    if(!name){alert("Please enter a display name.");return;}
    localStorage.setItem("osam-ai-display-name",name);
    try { if(auth.currentUser) await updateProfile(auth.currentUser,{displayName:name}); } catch(e) { alert("Saved on this device, but account profile could not be updated: "+e.message); }
    document.getElementById("profileName").textContent=name;
    document.getElementById("menuProfileName").textContent=name;
    document.getElementById("profileAvatar").textContent=name.slice(0,1).toUpperCase();
    closeFeaturePanel();
  });
}
function showSettings() {
  closeProfileMenu();
  const light=localStorage.getItem("osam-ai-theme")==="light";
  openFeaturePanel("Settings", '<div class="feature-card"><strong>Appearance</strong><p>Choose how OSAM AI looks on this device.</p><select id="osamTheme" class="feature-select"><option value="dark">Dark</option><option value="light">Light</option></select><button id="saveTheme" class="feature-action">Apply appearance</button></div><div class="feature-card"><strong>Chat storage</strong><p>Conversations are stored in this browser only. Use Library to export a backup.</p></div>');
  const select=document.getElementById("osamTheme"); select.value=light?"light":"dark";
  document.getElementById("saveTheme").addEventListener("click",()=>{
    const theme=select.value; localStorage.setItem("osam-ai-theme",theme);
    document.body.classList.toggle("osam-light",theme==="light");
    closeFeaturePanel();
  });
