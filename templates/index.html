
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARRIOR AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="brand">
                <div class="brand-logo">W</div>
                <span>WARRIOR AI</span>
            </div>

            <button class="new-chat" id="newChatBtn">
                <span>＋</span> New Chat
            </button>
        </div>

        <div class="history-title">YOUR CHATS</div>
        <div class="chat-history" id="chatHistory"></div>

        <div class="sidebar-bottom">
            <div class="profile">
                <div class="profile-avatar">W</div>
                <div>
                    <strong>WARRIOR AI</strong>
                    <small>AI Assistant</small>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Area -->
    <main class="main">

        <header class="topbar">
            <button class="menu-btn" id="menuBtn">☰</button>
            <div class="mobile-brand">WARRIOR AI</div>
            <div class="model-label">AI Assistant <span>●</span></div>
        </header>

        <section class="chat-area" id="chatArea">

            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-logo">W</div>

                <h1>Hello, I'm <span>WARRIOR AI</span></h1>
                <p>How can I help you today?</p>

                <div class="suggestions">
                    <button class="suggestion" data-prompt="Explain something in simple words">
                        <span>✦</span>
                        <strong>Explain something</strong>
                        <small>Make difficult topics easy</small>
                    </button>

                    <button class="suggestion" data-prompt="Help me write something">
                        <span>✎</span>
                        <strong>Write something</strong>
                        <small>Stories, emails and more</small>
                    </button>

                    <button class="suggestion" data-prompt="Help me with coding">
                        <span>⌘</span>
                        <strong>Write code</strong>
                        <small>Learn and build projects</small>
                    </button>

                    <button class="suggestion" data-prompt="Give me some creative ideas">
                        <span>✧</span>
                        <strong>Brainstorm ideas</strong>
                        <small>Explore something new</small>
                    </button>
                </div>
            </div>

            <div class="messages" id="chatMessages"></div>

        </section>

        <!-- Message Input -->
        <footer class="input-section">
            <form class="input-box" id="chatForm">
                <textarea
                    id="messageInput"
                    placeholder="Message WARRIOR AI..."
                    rows="1"
                    required
                ></textarea>

                <button type="submit" id="sendButton" class="send-btn">
                    ↑
                </button>
            </form>

            <p class="disclaimer">
                WARRIOR AI can make mistakes. Check important information.
            </p>
        </footer>

    </main>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
